# À déplacer dans .github/workflows/android.yml (le jeton utilisé pour la PR n’avait pas le scope « workflow »).
# Commande : git mv android/ci/github-workflow-android.yml .github/workflows/android.yml
name: Android APK

# Builds the phone + Android TV app (android/) and uploads the debug APK
# as a workflow artifact (Actions → run → Artifacts → nas-media-debug-apk).

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nas-media-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nas-media-debug-apk
          path: android/nas-media-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
