name: Release SPK

# Builds the native DSM 7 package and attaches it to the GitHub Release.
#
# Triggered by pushing a version tag (e.g. v1.2.0). The asset upload happens
# here rather than from a workstation because some networks block
# uploads.github.com.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish'
        required: true

permissions:
  contents: write

concurrency:
  group: release-spk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: the SPK runs on Node's built-in SQLite engine, so no
      # native addon has to be compiled.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build SPK
        run: npm run spk

      - name: List artefact
        run: ls -la dist-spk/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist-spk/*.spk)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no .spk produced in dist-spk/"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "${assets[@]}" \
              --title "NAS Simple Media ${TAG#v} — SPK natif DSM 7 (DS220+, geminilake)" \
              --notes-file synology/RELEASE_NOTES.md
          fi

          echo "### Release URL" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
