<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — NAS Simple Media</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e5a00d'/%3E%3Cpath d='M26 20l18 12-18 12z' fill='%23161616'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="brand" style="margin-bottom:1rem">
        <div class="brand-badge">▶</div>
        <span>NAS Simple Media</span>
      </div>
      <h1>Connexion</h1>
      <p>Compte personnel — l’admin crée les utilisateurs et partage les bibliothèques.</p>
      <div class="field">
        <label for="username">Identifiant</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus value="admin" />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="error hidden" id="error"></p>
      <button class="btn btn-primary" type="submit" style="width:100%">Se connecter</button>
    </form>
  </div>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const preset = params.get('user') || params.get('username');
      if (preset) document.getElementById('username').value = preset;
      try {
        const me = await fetch('/api/me').then(r => r.json());
        if (me.authenticated) location.href = '/';
      } catch {}
    })();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.classList.add('hidden');
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || 'Échec de connexion';
        err.classList.remove('hidden');
        return;
      }
      location.href = '/';
    });
  </script>
</body>
</html>
