<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NAS Simple Media</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">▶</div>
        <div>
          <div>NAS Simple Media</div>
          <div class="muted" style="font-size:0.75rem;font-weight:500" id="whoami"></div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button type="button" data-view="browse" class="active">Bibliothèques</button>
        <button type="button" data-view="shares">Mes partages</button>
        <button type="button" data-view="admin-libs" class="admin-only hidden">Admin · Bibliothèques</button>
        <button type="button" data-view="admin-users" class="admin-only hidden">Admin · Comptes</button>
      </nav>
      <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
        <button class="btn admin-only hidden" id="btnRescan" type="button">Rescan</button>
        <button class="btn btn-ghost" id="btnLogout" type="button">Déconnexion</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>
    <div class="search-row" id="searchRow">
      <input id="search" type="search" placeholder="Rechercher un titre, artiste, série…" />
    </div>

    <h2 class="section-title" id="sectionTitle">Bibliothèques</h2>
    <div id="content"></div>
  </div>

  <div class="player-panel hidden" id="playerPanel">
    <div class="player-inner">
      <div class="player-head">
        <h3 id="nowPlaying">Lecture</h3>
        <div style="display:flex;gap:0.4rem">
          <button class="btn" id="btnShareCurrent" type="button">Partager</button>
          <button class="btn btn-ghost" id="btnClosePlayer" type="button">Fermer</button>
        </div>
      </div>
      <video id="videoPlayer" controls playsinline class="hidden"></video>
      <audio id="audioPlayer" controls class="hidden"></audio>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="shareModal">
    <div class="modal">
      <h2>Lien de partage (1 média)</h2>
      <p class="muted" id="shareMediaTitle"></p>
      <div class="field">
        <label for="shareExpires">Expiration (ISO optionnel)</label>
        <input id="shareExpires" type="text" placeholder="ex. 2026-12-31T23:59:00" />
      </div>
      <div class="field">
        <label for="shareMaxUses">Utilisations max</label>
        <input id="shareMaxUses" type="number" min="1" placeholder="Illimité" />
      </div>
      <div class="field">
        <label for="sharePassword">Mot de passe (optionnel)</label>
        <input id="sharePassword" type="password" />
      </div>
      <p class="error hidden" id="shareError"></p>
      <p class="ok hidden" id="shareResult"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="shareCancel" type="button">Fermer</button>
        <button class="btn btn-primary" id="shareCreate" type="button">Créer</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="userModal">
    <div class="modal" style="width:min(480px,100%)">
      <h2 id="userModalTitle">Compte</h2>
      <div class="field">
        <label for="uName">Identifiant</label>
        <input id="uName" type="text" />
      </div>
      <div class="field">
        <label for="uPass">Mot de passe</label>
        <input id="uPass" type="password" placeholder="Laisser vide = inchangé (édition)" />
      </div>
      <div class="field">
        <label for="uRole">Rôle</label>
        <select id="uRole">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <div class="field">
        <label><input type="checkbox" id="uShare" checked /> Peut créer des liens de partage</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="uEnabled" checked /> Compte actif</label>
      </div>
      <div class="field">
        <label>Bibliothèques autorisées</label>
        <div id="uLibs" class="lib-checks"></div>
      </div>
      <p class="error hidden" id="userError"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="userCancel" type="button">Annuler</button>
        <button class="btn btn-primary" id="userSave" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="libModal">
    <div class="modal">
      <h2 id="libModalTitle">Bibliothèque</h2>
      <div class="field">
        <label for="lName">Nom</label>
        <input id="lName" type="text" placeholder="Films maison" />
      </div>
      <div class="field">
        <label for="lType">Type</label>
        <select id="lType">
          <option value="movies">Films</option>
          <option value="series">Séries</option>
          <option value="music">Musique</option>
        </select>
      </div>
      <div class="field">
        <label for="lPath">Chemin (relatif à MEDIA_PATH ou absolu)</label>
        <input id="lPath" type="text" placeholder="Movies" />
      </div>
      <div class="field">
        <label><input type="checkbox" id="lEnabled" checked /> Active</label>
      </div>
      <p class="error hidden" id="libError"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="libCancel" type="button">Annuler</button>
        <button class="btn btn-primary" id="libSave" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
